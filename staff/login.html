<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Login — Ung Kheang Heang Dental Clinic</title>
    <!-- Internal tool: not indexed, no need for search engines to crawl it. -->
    <meta name="robots" content="noindex, nofollow" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="staff.css" />
  </head>
  <body>
    <div class="staff-shell">
      <header class="staff-topbar">
        <span class="brand"><span aria-hidden="true">🦷</span> UKH Dental — Staff</span>
      </header>

      <main class="login-wrap">
        <div class="login-card">
          <h1>Staff Sign In</h1>
          <p class="subtitle">
            Access the appointment dashboard. Accounts are created by a
            clinic administrator — there is no public sign-up.
          </p>

          <form id="loginForm" novalidate>
            <div class="form-group">
              <label for="staffEmail">Email</label>
              <input
                type="email"
                id="staffEmail"
                name="staffEmail"
                autocomplete="username"
                required
              />
              <small class="error-message"></small>
            </div>

            <div class="form-group">
              <label for="staffPassword">Password</label>
              <input
                type="password"
                id="staffPassword"
                name="staffPassword"
                autocomplete="current-password"
                required
              />
              <small class="error-message"></small>
            </div>

            <button type="submit" class="button primary full-width" id="loginButton">
              Sign In
            </button>

            <div class="alert" id="loginAlert" role="status"></div>
          </form>

          <p class="subtitle login-footnote">
            <a href="./set-password.html">Forgot your password, or setting up an invite?</a>
          </p>
        </div>
      </main>
    </div>

    <script src="../config.js"></script>
    <script type="module" src="./login.js"></script>
  </body>
</html>
